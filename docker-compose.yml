version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: spendsense_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: spendsense_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=${MONGODB_URI}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_TEXT_MODEL=${GROQ_TEXT_MODEL:-openai/gpt-oss-120b}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
